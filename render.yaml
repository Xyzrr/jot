# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  # Backend API service (Docker-based for Bun + Python support)
  - type: web
    name: jot-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # Frontend static site
  - type: web
    name: jot-web
    runtime: static
    buildCommand: rm -rf node_modules package-lock.json && npm install && cd web && npm run build
    staticPublishPath: ./web/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Proxy API requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://jot-api.onrender.com/api/*
      # SPA fallback - serve index.html for all other routes
      - type: rewrite
        source: /*
        destination: /index.html
